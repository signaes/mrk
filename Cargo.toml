[package]
name = "mrk"
version = "0.7.1"
edition = "2024"
description = "A minimal markup builder library"
authors = ["Thiago Oliveira <thiago@signaes.com>"]
license = "MIT"
repository = "https://github.com/signaes/mrk"
homepage = "https://github.com/signaes/mrk"
keywords = ["markup", "builder", "html"]
categories = ["template-engine"]

[features]
default = []
# Templated component data model: `Component`, `Expr`, `Props`, render impls.
components = []
# On-the-wire `.mrk` format: depends on `components`. Adds `Mrk` encoder/decoder,
# `ParseError`, and `MAX_PAYLOAD`.
ir = ["components"]
# HTML rendering helpers (114 tag factories, void elements, escaping).
html = []
# SVG element factories for the 67 SVG 2 elements (independent of `html`).
svg = []

[dependencies]

[package.metadata.docs.rs]
features = ["html", "svg", "ir"]
